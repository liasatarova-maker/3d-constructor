<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f8fc"><title>LuxPrint — каталог продукции</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="src/styles.css"><link rel="stylesheet" href="src/catalog-cover.css"></head>
<body><main class="app-shell">
<section class="screen catalog-screen" id="catalogScreen"><div class="catalog-head"><div class="catalog-title"><div class="eyebrow">LuxPrint · больше, чем печать</div><h1>Продукция</h1></div><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Поиск по продукции"></label></div><p class="catalog-subtitle">Выберите изделие, чтобы посмотреть характеристики и стоимость.</p><nav class="categories" id="categories"></nav><div class="product-grid" id="productGrid"></div></section>
<section class="screen builder-screen is-hidden" id="builderScreen"><div class="builder-layout">
<aside class="panel configurator"><button class="back-link" id="backToCatalog" type="button">← <span>Каталог</span></button><div class="product-heading"><div class="eyebrow">Полиграфия</div><h1></h1><p></p></div><div id="optionsRoot"></div><div class="price-card"><div><span>Стоимость заказа</span><strong id="priceValue">—</strong><small></small></div><button class="primary" id="quoteButton" type="button">Сформировать заявку →</button></div></aside>
<section class="product-preview"><div class="preview-badge">Пример изделия</div><img id="productPreviewImage" alt="Пример изделия"><div class="preview-caption"><b id="previewTitle"></b><span>Изображение носит демонстрационный характер</span></div></section>
</div></section></main>
<div class="modal is-hidden" id="quoteModal"><div class="modal-card"><button class="modal-close" id="closeModal">×</button><div class="eyebrow">Заявка на производство</div><h2></h2><div class="quote-preview"><img id="quoteImage" alt="Пример изделия"></div><div class="quote-details" id="quoteDetails"></div><button class="primary wide" id="confirmQuote">Отправить заявку</button><p class="modal-note">Сейчас это демонстрация заявки. Позже подключим реальную отправку в Bitrix.</p></div></div>
<script src="src/data.js"></script><script src="src/app.js"></script></body></html>
